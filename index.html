<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>번호 스탬프 카메라</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="btnSettings" class="icon-btn" aria-label="설정">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <button id="btnNext" class="next" aria-label="다음 번호 (눌러서 수정)">
      <span class="next-label">다음</span>
      <span id="nextText" class="next-text">001</span>
    </button>
    <button id="btnUndo" class="icon-btn" aria-label="직전 촬영 취소" disabled>
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-5 1-6.9 2.6L2 7v9h9l-3.6-3.6A7.9 7.9 0 0 1 20.1 16l2.3-.8A10.4 10.4 0 0 0 12.5 8z"/></svg>
    </button>
  </header>

  <main id="stage" class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div id="flash" class="flash"></div>
    <div id="camFallback" class="fallback" hidden>
      <p id="camError" class="fallback-msg">카메라를 시작하는 중…</p>
      <button id="btnRetry" class="btn primary">카메라 다시 시도</button>
      <button id="btnNativeCam" class="btn">기본 카메라 앱으로 촬영</button>
      <button id="btnGallery" class="btn">갤러리 사진에 스탬프 찍기</button>
    </div>
  </main>

  <footer class="bottombar">
    <button id="btnList" class="thumb-btn" aria-label="촬영 목록">
      <img id="lastThumb" alt="">
      <span id="listCount" class="badge" hidden>0</span>
    </button>
    <button id="btnShutter" class="shutter" aria-label="촬영"><span></span></button>
    <button id="btnSwitch" class="icon-btn round" aria-label="전면/후면 카메라 전환">
      <svg viewBox="0 0 24 24"><path d="M20 5h-3.2L15 3H9L7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 13a5 5 0 0 1-4.6-3H5l3-3 3 3H9.6a3 3 0 0 0 5.3.6l1.5 1.2A5 5 0 0 1 12 18zm4-4-3-3h1.4a3 3 0 0 0-5.3-.6L7.6 9.2A5 5 0 0 1 16.6 11H19z"/></svg>
    </button>
  </footer>

  <input id="fileNative" type="file" accept="image/*" capture="environment" hidden>
  <input id="fileGallery" type="file" accept="image/*" multiple hidden>

  <!-- 설정 패널 -->
  <section id="settingsSheet" class="sheet" hidden aria-label="설정">
    <div class="sheet-head">
      <h2>설정</h2>
      <button class="btn small" data-close>닫기</button>
    </div>
    <div class="sheet-body">
      <fieldset id="secNumber">
        <legend>번호</legend>
        <div class="row">
          <label>다음 번호<input type="number" id="s-current" inputmode="numeric" step="1"></label>
          <button id="btnResetNum" class="btn small">시작 번호로</button>
        </div>
        <div class="row">
          <label>시작 번호<input type="number" id="s-start" inputmode="numeric" step="1"></label>
          <label>증감값<input type="number" id="s-step" inputmode="numeric" step="1"></label>
        </div>
        <div class="row">
          <label>자릿수<select id="s-pad">
            <option value="0">그대로 (7)</option>
            <option value="2">2자리 (07)</option>
            <option value="3">3자리 (007)</option>
            <option value="4">4자리 (0007)</option>
          </select></label>
        </div>
        <div class="row">
          <label>접두어<input type="text" id="s-prefix" placeholder="예: A-"></label>
          <label>접미어<input type="text" id="s-suffix" placeholder="예: 번"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>위치</legend>
        <div class="grid9" id="s-position">
          <button data-pos="tl" aria-label="좌상단"></button><button data-pos="tc" aria-label="상단 가운데"></button><button data-pos="tr" aria-label="우상단"></button>
          <button data-pos="ml" aria-label="왼쪽 가운데"></button><button data-pos="mc" aria-label="정가운데"></button><button data-pos="mr" aria-label="오른쪽 가운데"></button>
          <button data-pos="bl" aria-label="좌하단"></button><button data-pos="bc" aria-label="하단 가운데"></button><button data-pos="br" aria-label="우하단"></button>
        </div>
        <label class="range">여백 <output id="o-margin"></output><input type="range" id="s-margin" min="0" max="15" step="0.5"></label>
      </fieldset>

      <fieldset>
        <legend>글자</legend>
        <label class="range">크기 <output id="o-size"></output><input type="range" id="s-size" min="2" max="30" step="0.5"></label>
        <div class="row">
          <label class="check"><input type="checkbox" id="s-bold"> 굵게</label>
          <label class="color">글자색<input type="color" id="s-color"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>테두리</legend>
        <div class="row">
          <label class="check"><input type="checkbox" id="s-outline"> 외곽선</label>
          <label class="color">색<input type="color" id="s-outlineColor"></label>
        </div>
        <label class="range">외곽선 두께 <output id="o-outlineWidth"></output><input type="range" id="s-outlineWidth" min="1" max="10" step="1"></label>
        <div class="row">
          <label class="check"><input type="checkbox" id="s-box"> 배경 박스</label>
          <label class="color">색<input type="color" id="s-boxColor"></label>
        </div>
        <label class="range">박스 불투명도 <output id="o-boxOpacity"></output><input type="range" id="s-boxOpacity" min="10" max="100" step="5"></label>
      </fieldset>

      <fieldset>
        <legend>날짜/시간</legend>
        <label class="check"><input type="checkbox" id="s-dateOn"> 날짜/시간 표시</label>
        <div class="row">
          <label>형식<select id="s-dateFormat"></select></label>
          <label>배치<select id="s-dateLayout">
            <option value="below">번호 아래 줄</option>
            <option value="inline">번호 옆 같은 줄</option>
          </select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>저장</legend>
        <label>저장 방식<select id="s-saveMode">
          <option value="download">찍을 때마다 자동 다운로드</option>
          <option value="share">찍을 때마다 공유 창 열기</option>
          <option value="list">앱 목록에만 저장 (나중에 ZIP)</option>
        </select></label>
        <label class="check"><input type="checkbox" id="s-keepInList"> 앱 촬영 목록에도 보관</label>
        <label>파일명 규칙<input type="text" id="s-fileName"></label>
        <p class="hint">{no} 번호 · {date} 20261029 · {time} 143012 → <b id="fileNamePreview"></b></p>
        <label class="range">JPEG 품질 <output id="o-quality"></output><input type="range" id="s-quality" min="50" max="100" step="1"></label>
      </fieldset>

      <fieldset>
        <legend>카메라</legend>
        <label class="check"><input type="checkbox" id="s-hiRes"> 고화질 촬영 (기기 원본 해상도, 실험 기능)</label>
        <p class="hint">켜면 촬영이 조금 느려질 수 있습니다. 사진 방향이 이상하면 끄세요. <span id="resInfo"></span></p>
        <button id="btnResetAll" class="btn small danger">설정 전체 초기화</button>
      </fieldset>
      <p class="hint center">번호 스탬프 카메라 · <span id="appVersion"></span></p>
    </div>
  </section>

  <!-- 촬영 목록 -->
  <section id="listSheet" class="sheet full" hidden aria-label="촬영 목록">
    <div class="sheet-head">
      <h2>촬영 목록 <small id="listSummary"></small></h2>
      <button class="btn small" data-close>닫기</button>
    </div>
    <div class="list-actions">
      <button id="btnZip" class="btn primary small">ZIP으로 내보내기</button>
      <button id="btnGallery2" class="btn small">갤러리 사진 추가</button>
      <button id="btnClear" class="btn small danger">전체 삭제</button>
    </div>
    <div id="listGrid" class="list-grid"></div>
    <p id="listEmpty" class="hint center" hidden>아직 촬영한 사진이 없습니다.</p>
  </section>

  <!-- 사진 보기 -->
  <section id="viewer" class="viewer" hidden aria-label="사진 보기">
    <img id="viewerImg" alt="">
    <div class="viewer-bar">
      <span id="viewerName"></span>
      <div>
        <button id="vDownload" class="btn small">다운로드</button>
        <button id="vShare" class="btn small">공유</button>
        <button id="vDelete" class="btn small danger">삭제</button>
        <button id="vClose" class="btn small">닫기</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
